<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Receipt - レシート自動家計簿</title>
    <!-- CSSファイル（機能別に分割） -->
    <link rel="stylesheet" href="core/base.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="core/layout.css">
    <link rel="stylesheet" href="features/dashboard/calendar.css">
    <link rel="stylesheet" href="features/dashboard/receipt-list.css">
    <link rel="stylesheet" href="features/editor/editor.css">
    <link rel="stylesheet" href="features/editor/form.css">
    <link rel="stylesheet" href="components/loading.css">
    <link rel="stylesheet" href="components/buttons.css">
    <link rel="stylesheet" href="components/modal.css">
    <link rel="stylesheet" href="features/settings/settings.css">
    <link rel="stylesheet" href="core/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
</head>
<body>
    <!-- ヘッダー -->
    <header class="app-header">
        <div class="container">
            <div class="header-content">
                <a href="/index.html" class="back-button" id="backLink">← ポートフォリオに戻る</a>
                <h1 class="app-title">Smart Receipt</h1>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="app-main">
        <!-- ダッシュボード画面 -->
        <section id="dashboard" class="screen active">
            <div class="container">
                <!-- サマリー -->
                <div class="summary-card">
                    <h2>今月の支出</h2>
                    <p class="summary-amount" id="monthlyTotal">¥0</p>
                </div>

                <!-- 週間グラフ -->
                <div class="chart-card">
                    <h3>週間支出</h3>
                    <canvas id="weeklyChart"></canvas>
                </div>

                <!-- 最近のレシートリスト -->
                <div class="receipts-list" id="recentSection">
                    <h3>最近のレシート</h3>
                    <div id="receiptsContainer" class="receipts-container">
                        <!-- 動的に生成 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- カレンダー画面 -->
        <section id="calendarScreen" class="screen">
            <div class="container">
                <div class="calendar-card" id="calendarSection">
                    <div class="calendar-header">
                        <button class="calendar-nav" id="prevMonth">←</button>
                        <h3 id="calendarMonth">2024年1月</h3>
                        <button class="calendar-nav" id="nextMonth">→</button>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
            </div>
        </section>

        <!-- エディタ画面（撮影・編集） -->
        <section id="editor" class="screen">
            <div class="container">
                <div class="editor-content">
                    <!-- 画像プレビュー -->
                    <div class="image-preview-section">
                        <div class="image-preview" id="imagePreview">
                            <p class="placeholder-text">レシート画像をアップロード</p>
                        </div>
                        <input type="file" id="imageInput" accept="image/*" capture="environment" style="display: none;">
                        <button class="btn btn-primary" id="captureBtn">📷 カメラで撮影</button>
                    </div>

                    <!-- OCR処理中インジケーター -->
                    <div class="ocr-loading" id="ocrLoading" style="display: none;">
                        <div class="spinner"></div>
                        <p>レシートを読み取っています...</p>
                    </div>

                    <!-- フォーム -->
                    <form class="receipt-form" id="receiptForm">
                        <!-- 日付 -->
                        <div class="form-group">
                            <label for="receiptDate">日付</label>
                            <input type="date" id="receiptDate" name="date" required>
                            <div class="field-status" id="dateStatus"></div>
                            <div class="error-message" id="dateError"></div>
                        </div>

                        <!-- 店舗名 -->
                        <div class="form-group">
                            <label for="merchantName">店舗名</label>
                            <input type="text" id="merchantName" name="merchant" required>
                            <div class="field-status" id="merchantStatus"></div>
                            <div class="error-message" id="merchantError"></div>
                        </div>

                        <!-- 合計金額 -->
                        <div class="form-group">
                            <label for="totalAmount">合計金額</label>
                            <input type="number" id="totalAmount" name="amount" min="0" step="1" required>
                            <div class="field-status" id="amountStatus"></div>
                            <div class="error-message" id="amountError"></div>
                        </div>

                        <!-- カテゴリ -->
                        <div class="form-group">
                            <label for="category">カテゴリ</label>
                            <select id="category" name="category" required>
                                <option value="food">食費</option>
                                <option value="daily">日用品</option>
                                <option value="restaurant">外食</option>
                                <option value="cafe">カフェ</option>
                                <option value="transport">交通費</option>
                                <option value="other">その他</option>
                            </select>
                        </div>

                        <!-- メモ -->
                        <div class="form-group">
                            <label for="memo">メモ</label>
                            <textarea id="memo" name="memo" rows="3"></textarea>
                        </div>

                        <!-- アクションボタン -->
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="cancelBtn">キャンセル</button>
                            <button type="button" class="btn btn-secondary" id="retakeBtn">再撮影</button>
                            <button type="submit" class="btn btn-primary">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- FAB (Floating Action Button) -->
    <button class="fab bottom-nav-safe" id="fabBtn" aria-label="レシートを追加">
        <span>+</span>
    </button>

    <!-- ボトムナビゲーション -->
    <nav class="bottom-nav" id="bottomNav" aria-label="メインナビゲーション">
        <button class="bottom-nav__item is-active" type="button" data-nav-action="dashboard" data-scroll-target="#dashboard">
            <span class="bottom-nav__icon" aria-hidden="true">🏠</span>
            <span class="bottom-nav__label">ホーム</span>
        </button>
        <button class="bottom-nav__item" type="button" data-nav-action="calendar" data-scroll-target="#calendarSection">
            <span class="bottom-nav__icon" aria-hidden="true">📅</span>
            <span class="bottom-nav__label">カレンダー</span>
        </button>
        <button class="bottom-nav__item" type="button" data-nav-action="settings">
            <span class="bottom-nav__icon" aria-hidden="true">⚙️</span>
            <span class="bottom-nav__label">設定</span>
        </button>
    </nav>

    <!-- 日付別レシート一覧モーダル -->
    <div id="dateReceiptsModal" class="modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="dateReceiptsModalTitle">レシート一覧</h2>
                <button class="modal-close" id="closeDateReceiptsBtn" aria-label="閉じる">×</button>
            </div>
            <div class="modal-body">
                <div id="dateReceiptsContainer" class="receipts-container">
                    <!-- 動的に生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>設定</h2>
                <button class="modal-close" id="closeSettingsBtn" aria-label="閉じる">×</button>
            </div>

            <div class="modal-body">
                <!-- 週間予算セクション -->
                <section class="settings-section">
                    <h3>週間予算</h3>
                    <div class="form-group">
                        <label for="weeklyBudgetInput">週間予算（円）</label>
                        <input type="number" id="weeklyBudgetInput" min="0" step="100" />
                        <p class="form-hint">週間の支出予算を設定します。グラフの予算ラインに反映されます。</p>
                    </div>
                </section>

                <!-- カテゴリ管理セクション -->
                <section class="settings-section">
                    <h3>カテゴリ管理</h3>
                    <div id="categoriesList" class="categories-list">
                        <!-- 動的に生成 -->
                    </div>
                    <button class="btn btn-secondary" id="addCategoryBtn">+ カテゴリを追加</button>
                </section>

                <!-- キーワード設定セクション -->
                <section class="settings-section">
                    <h3>キーワード設定</h3>
                    <p class="form-hint">店舗名に含まれるキーワードで自動的にカテゴリを分類します。</p>
                    <div id="keywordsList" class="keywords-list">
                        <!-- 動的に生成 -->
                    </div>
                </section>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelSettingsBtn">キャンセル</button>
                <button class="btn btn-primary" id="saveSettingsBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- スクリプト -->
    <script src="services/storage.js"></script>
    <script src="services/parser.js"></script>
    <script src="services/category-classifier.js"></script>
    <script src="services/ocr-service.js"></script>
    <!-- アプリケーションコア -->
    <script src="core/app-core.js"></script>
    <!-- 機能別モジュール -->
    <script src="features/editor/editor.js"></script>
    <script src="features/dashboard/dashboard.js"></script>
    <script src="features/settings/settings.js"></script>
    <!-- アプリケーション起動 -->
    <script src="app.js"></script>
</body>
</html>
